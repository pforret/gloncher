; gloncher example: a local Laravel dev stack in one screen.
;
;   gloncher examples/laravel.ini
;
; Section order is screen order. Every section is one process; the [gloncher]
; section holds global settings.

[gloncher]
title = laravel
; dir = ~/Code/my-laravel-app
refresh = 100ms

; on_exit = quit: the session exists to run this. If the web server dies,
; gloncher stops everything else and exits too.
[server]
cmd = php artisan serve
lines = 2
width = full
color = green
on_exit = quit

[logs]
; Command substitution works because commands run through the shell, which is
; what makes "tail the newest log file" a one-liner.
cmd = tail -n 100 -f "$(ls -t storage/logs/*.log | head -1)"
lines = 5
width = full
filter = ERROR
color = red

[vite]
cmd = npm run dev
show = no
color = yellow

; Workers are expected to come and go, so bring them straight back.
[queue]
cmd = php artisan queue:work
lines = 2
width = half
color = cyan
on_exit = restart

[schedule]
cmd = php artisan schedule:work
lines = 2
width = half
color = magenta
on_exit = restart
