; A self-contained demo that needs nothing installed. Try:
;   gloncher examples/demo.ini

[gloncher]
title = demo
refresh = 100ms

[clock]
cmd = while true; do date; sleep 1; done
lines = 2
width = full
color = green

[noisy]
cmd = i=0; while true; do i=$((i+1)); echo "line $i"; sleep 0.2; done
lines = 4
width = full
color = cyan

[errors]
cmd = while true; do echo "ERROR something broke" 1>&2; sleep 3; done
lines = 2
width = half
filter = ERROR
color = red

[quiet]
cmd = sleep 3600
lines = 2
width = half

; on_exit = restart: this one dies every few seconds and comes back, and the
; title shows the restart count.
[flaky]
cmd = echo "starting up"; sleep 4; echo "crashed" 1>&2; exit 1
lines = 2
width = half
on_exit = restart
color = yellow

[hidden]
cmd = while true; do echo tick; sleep 1; done
show = no
